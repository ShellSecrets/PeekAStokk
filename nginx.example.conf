server {
    listen 80;
    listen [::]:80;
    server_name logs.example.com;
    server_tokens off;
    # more_clear_headers Server; ## nginx-extras package required

    access_log /var/log/nginx/peekastokk.access.log;
    error_log  /var/log/nginx/peekastokk.error.log;

    # The live log stream (SSE).
    location /events {
        proxy_pass http://127.0.0.1:8844;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90s;
    }

    # Log forwarding from remote PeekAStokk clients (streamed request
    # bodies). Harmless to keep even when unused.
    location /ingest {
        proxy_pass http://127.0.0.1:8844;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        client_max_body_size 0;
    }

    # The UI page and the small JSON APIs.
    location / {
        proxy_pass http://127.0.0.1:8844;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
