<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeekAStokk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👀</text></svg>">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --err: #ff7b72;
    --warn: #d29922;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem .75rem;
    align-items: center;
    padding: .55rem .9rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  .dot.reconnecting { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #statusText { color: var(--muted); font-size: 12px; }

  #search {
    flex: 1 1 200px;
    min-width: 160px;
    max-width: 360px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: .35rem .6rem;
    font-size: 13px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }

  #filePicker { position: relative; }
  #fileBtn {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    max-width: 280px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: .32rem .65rem;
    font-size: 12.5px;
    cursor: pointer;
  }
  #fileBtn:hover, #fileBtn.open { border-color: var(--accent); }
  #fileBtn .fdot { flex: none; }
  #fileBtnLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #fileBtn .caret { color: var(--muted); font-size: 9px; }
  #fileMenu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 50;
    width: 340px;
    max-width: 90vw;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
    padding: .4rem;
  }
  #fileSearch {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: .32rem .55rem;
    font-size: 12.5px;
    outline: none;
    margin-bottom: .35rem;
  }
  #fileSearch:focus { border-color: var(--accent); }
  #fileList { max-height: 300px; overflow-y: auto; }
  .fileItem {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .32rem .45rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .fileItem:hover { background: rgba(255,255,255,.06); }
  .fileItem.active { background: rgba(88,166,255,.16); }
  .fileItem[hidden] { display: none; }
  .fileItem .fcheck { width: 1em; color: var(--ok); visibility: hidden; flex: none; }
  .fileItem.on .fcheck { visibility: visible; }
  .fileItem .fdot { opacity: .35; }
  .fileItem.on .fdot { opacity: 1; }
  .fileItem .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .fileItem.on .fname { color: var(--fg); }
  .fileItem .fcount { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .fdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
  #fileNoMatch { color: var(--muted); font-size: 12px; padding: .4rem; font-style: italic; }

  .actions { display: flex; align-items: center; gap: .5rem; margin-left: auto; }
  .actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: .3rem .7rem;
    font-size: 12px;
    cursor: pointer;
  }
  .actions button:hover { background: rgba(255,255,255,.05); }
  .actions button.active { border-color: var(--warn); color: var(--warn); }
  #stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #linesCtl { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: 12px; }
  #maxLines {
    width: 4.5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: .28rem .4rem;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    outline: none;
  }
  #maxLines:focus { border-color: var(--accent); }

  #log { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: .35rem 0; }
  #older:empty + #live:empty::before {
    content: "Waiting for log lines…";
    display: block;
    padding: 2rem .9rem;
    color: var(--muted);
    font-style: italic;
  }
  #older .line { opacity: .82; }
  .divider {
    display: flex;
    align-items: center;
    gap: .6rem;
    color: var(--muted);
    font-size: 11px;
    padding: .15rem .9rem;
    user-select: none;
  }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  .divider.gap { color: var(--warn); }
  .line {
    display: flex;
    gap: .6rem;
    padding: .04rem .9rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
  }
  .line:hover { background: rgba(255,255,255,.04); }
  /* Only the log text itself is selectable: copying lines must not drag
     the timestamp and file-name columns along. */
  .ts { color: var(--muted); flex: none; user-select: none; }
  .badge { color: var(--c, var(--accent)); flex: none; font-weight: 600; user-select: none; }
  .txt { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .lvl-error .txt { color: var(--err); }
  .lvl-warn .txt { color: var(--warn); }
  mark { background: rgba(88,166,255,.35); color: inherit; border-radius: 2px; }

  #jump {
    position: fixed;
    bottom: 1rem;
    right: 1.25rem;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 999px;
    padding: .4rem .9rem;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  #jump:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span>PeekAStokk</span>
    <span id="statusDot" class="dot" title="connection status"></span>
    <span id="statusText">connecting</span>
  </div>
  <input id="search" type="search" placeholder="Filter lines… ( / )" autocomplete="off">
  <div id="filePicker">
    <button id="fileBtn" title="Select files to view (⌘S / Ctrl+S)">
      <span class="fdot" id="fileBtnDot"></span>
      <span id="fileBtnLabel">loading…</span>
      <span class="caret">▼</span>
    </button>
    <div id="fileMenu" hidden>
      <input id="fileSearch" type="search" placeholder="Search files…" autocomplete="off">
      <div id="fileList"></div>
      <div id="fileNoMatch" hidden>No files match</div>
    </div>
  </div>
  <div class="actions">
    <label id="linesCtl" title="Number of lines kept on screen">Lines
      <input id="maxLines" type="number" inputmode="numeric" min="10" max="20000" step="50">
    </label>
    <button id="pause" title="Stop appending new lines to the view">Pause</button>
    <button id="clear" title="Discard buffered lines">Clear</button>
    <span id="stats"></span>
  </div>
</header>
<main id="log">
  <div id="older"></div>
  <div id="live"></div>
</main>
<button id="jump" hidden>Jump to latest ↓</button>

<script>
"use strict";

const logEl = document.getElementById("log");
const olderEl = document.getElementById("older");
const liveEl = document.getElementById("live");
const fileBtn = document.getElementById("fileBtn");
const fileBtnDot = document.getElementById("fileBtnDot");
const fileBtnLabel = document.getElementById("fileBtnLabel");
const fileMenu = document.getElementById("fileMenu");
const fileSearch = document.getElementById("fileSearch");
const fileListEl = document.getElementById("fileList");
const fileNoMatch = document.getElementById("fileNoMatch");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const statsEl = document.getElementById("stats");
const searchEl = document.getElementById("search");
const pauseBtn = document.getElementById("pause");
const clearBtn = document.getElementById("clear");
const jumpBtn = document.getElementById("jump");
const maxLinesEl = document.getElementById("maxLines");

const PALETTE = ["#58a6ff", "#3fb950", "#d29922", "#f778ba", "#a371f7", "#ff7b72", "#39c5cf", "#e3b341"];
const MAX_STORE = 20000; // events kept in memory
const LINES_MIN = 10, LINES_MAX = 20000, LINES_KEY = "peekastokk.maxLines";

// Lines kept on screen. Priority: value the user set here (localStorage),
// then the server's configured default, then 500.
let maxLines = 500;
const storedLines = parseInt(localStorage.getItem(LINES_KEY), 10);
if (!Number.isNaN(storedLines)) maxLines = clampLines(storedLines);
maxLinesEl.value = maxLines;

function clampLines(n) {
  return Math.min(LINES_MAX, Math.max(LINES_MIN, n));
}

// Files are known only by an opaque server-assigned id and a display name;
// absolute paths never reach the browser.
const files = new Map(); // id -> {id, name, color, count, enabled, itemEl, countEl}

// The selection survives reloads, stored per browser by display name (ids
// are positional and could shift between server runs).
const SELECTED_KEY = "peekastokk.selected";
let initialSelection = null; // Set of names to restore, only during init

function savedSelection() {
  try {
    const v = JSON.parse(localStorage.getItem(SELECTED_KEY));
    return Array.isArray(v) ? v : null;
  } catch {
    return null;
  }
}

function persistSelection() {
  const names = [...files.values()].filter((f) => f.enabled).map((f) => f.name);
  try { localStorage.setItem(SELECTED_KEY, JSON.stringify(names)); } catch {}
}
let events = [];
let lastSeq = 0;
let filter = "";
let paused = false;
let pendingNodes = [];
let rafScheduled = false;

// Scrollback: scrolling to the top pages older lines from the file on disk
// (via /api/before), keeping only a bounded window in the browser. Reaching
// the bottom again frees it all.
const OLDER_MAX = 6000;   // older lines kept in the DOM before unloading
const OLDER_PAGE = 2000;  // lines fetched per request per file
let olderCount = 0;
let loadingOlder = false;
const olderLowest = new Map(); // file -> lowest backfilled offset
const liveOldest = new Map();  // file -> offset of oldest line held
const olderDone = new Set();   // files whose beginning has been reached

// Lazy loading: the stream only carries selected files (?files= on
// /events). Enabling a file loads its recent lines from disk, then joins
// its live stream; "floors" drops the few live events that could overlap
// the disk snapshot during that handover.
const floors = new Map(); // file -> ignore live events below this offset
let es = null;

// The app's own scrollTop assignments fire scroll events too; the handler
// must not mistake them for user intent (that both loaded scrollback
// spontaneously and instantly wiped it again on short content).
let ignoreScrollUntil = 0;
function programmaticScroll(top) {
  logEl.scrollTop = top;
  ignoreScrollUntil = performance.now() + 200;
}

function ensureFile(id, name) {
  let f = files.get(id);
  if (f) return f;
  f = {
    id,
    name: name || "log " + id,
    color: PALETTE[files.size % PALETTE.length],
    count: 0,
    // A remembered selection wins; otherwise only the first file starts
    // visible and the rest cost nothing until selected in the dropdown.
    enabled: initialSelection ? initialSelection.has(name) : files.size === 0,
  };
  const item = document.createElement("div");
  item.className = "fileItem" + (f.enabled ? " on" : "");
  item.style.setProperty("--c", f.color);
  item.title = f.name;
  const check = document.createElement("span");
  check.className = "fcheck";
  check.textContent = "✓";
  const dot = document.createElement("span");
  dot.className = "fdot";
  const nameEl = document.createElement("span");
  nameEl.className = "fname";
  nameEl.textContent = f.name;
  const count = document.createElement("span");
  count.className = "fcount";
  count.textContent = "–";
  item.append(check, dot, nameEl, count);
  item.addEventListener("click", () => { toggleFile(f); });
  item.addEventListener("mouseenter", () => { setActive(f); });
  fileListEl.appendChild(item);
  f.itemEl = item;
  f.countEl = count;
  files.set(id, f);
  updateFileButton();
  return f;
}

// updateFileButton renders the current selection into the dropdown trigger.
function updateFileButton() {
  const selected = [...files.values()].filter((f) => f.enabled);
  if (selected.length === 0) {
    fileBtnDot.style.setProperty("--c", "var(--muted)");
    fileBtnLabel.textContent = files.size ? "no file selected" : "no files";
    fileBtn.title = "Select files to view";
    return;
  }
  fileBtnDot.style.setProperty("--c", selected[0].color);
  fileBtnLabel.textContent =
    selected[0].name + (selected.length > 1 ? `  +${selected.length - 1}` : "");
  fileBtn.title = selected.map((f) => f.name).join("\n");
}

// Keyboard navigation: one row carries the highlight; arrows move it,
// Enter toggles it.
let activeFile = null;

function setActive(f) {
  if (activeFile && activeFile.itemEl) activeFile.itemEl.classList.remove("active");
  activeFile = f || null;
  if (activeFile) {
    activeFile.itemEl.classList.add("active");
    activeFile.itemEl.scrollIntoView({ block: "nearest" });
  }
}

function visibleFiles() {
  // DOM order, not registration order: the list is re-sorted on open so
  // arrow-key navigation must follow what is on screen.
  const byEl = new Map([...files.values()].map((f) => [f.itemEl, f]));
  return [...fileListEl.children].map((el) => byEl.get(el)).filter((f) => f && !f.itemEl.hidden);
}

function moveActive(delta) {
  const vis = visibleFiles();
  if (!vis.length) { setActive(null); return; }
  const i = vis.indexOf(activeFile);
  if (i === -1) setActive(delta > 0 ? vis[0] : vis[vis.length - 1]);
  else setActive(vis[(i + delta + vis.length) % vis.length]);
}

// Selected files sort to the top of the dropdown, both groups keeping
// their registration order. Applied when the menu opens (not on toggle,
// so rows don't jump around under the cursor mid-selection).
function sortFileList() {
  const all = [...files.values()];
  for (const f of all.filter((f) => f.enabled)) fileListEl.appendChild(f.itemEl);
  for (const f of all.filter((f) => !f.enabled)) fileListEl.appendChild(f.itemEl);
}

function filterFileList() {
  const q = fileSearch.value.trim().toLowerCase();
  let visible = 0;
  for (const f of files.values()) {
    const hit = !q || f.name.toLowerCase().includes(q);
    f.itemEl.hidden = !hit;
    if (hit) visible++;
  }
  fileNoMatch.hidden = visible > 0;
  if (!activeFile || activeFile.itemEl.hidden) setActive(visibleFiles()[0]);
}

function openFileMenu() {
  fileMenu.hidden = false;
  fileBtn.classList.add("open");
  fileSearch.value = "";
  sortFileList();
  filterFileList();
  fileSearch.focus();
}

function closeFileMenu() {
  fileMenu.hidden = true;
  fileBtn.classList.remove("open");
  setActive(null);
}

function matches(ev) {
  const f = files.get(ev.file);
  if (f && !f.enabled) return false;
  return !filter || ev.text.toLowerCase().includes(filter);
}

function levelOf(text) {
  if (/\b(err(or)?|fatal|panic|exception|crit(ical)?)\b/i.test(text)) return "error";
  if (/\bwarn(ing)?\b/i.test(text)) return "warn";
  return "";
}

function fmtTime(iso) {
  const d = new Date(iso);
  const p = (n, w = 2) => String(n).padStart(w, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
}

// Builds the text span, wrapping filter matches in <mark>. Uses DOM APIs
// only — log content is never injected as HTML.
function appendHighlighted(el, text) {
  if (!filter) {
    el.textContent = text;
    return;
  }
  const lower = text.toLowerCase();
  let i = 0, idx;
  while ((idx = lower.indexOf(filter, i)) !== -1) {
    if (idx > i) el.append(text.slice(i, idx));
    const m = document.createElement("mark");
    m.textContent = text.slice(idx, idx + filter.length);
    el.append(m);
    i = idx + filter.length;
  }
  if (i < text.length) el.append(text.slice(i));
}

function buildLine(ev) {
  const f = ensureFile(ev.file);
  const line = document.createElement("div");
  const lvl = levelOf(ev.text);
  line.className = "line" + (lvl ? " lvl-" + lvl : "");
  const ts = document.createElement("span");
  ts.className = "ts";
  ts.textContent = ev.time ? fmtTime(ev.time) : "·";
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.style.setProperty("--c", f.color);
  badge.textContent = f.name;
  badge.title = f.name;
  const txt = document.createElement("span");
  txt.className = "txt";
  appendHighlighted(txt, ev.text);
  line.append(ts, badge, txt);
  return line;
}

function nearBottom() {
  return logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 48;
}

function scheduleFlush() {
  if (rafScheduled) return;
  rafScheduled = true;
  requestAnimationFrame(() => {
    rafScheduled = false;
    if (pendingNodes.length) {
      // Follow the tail only while no scrollback is open: reading history
      // pauses auto-scroll, otherwise live traffic would keep yanking the
      // view (and freeing the history) underneath the reader.
      const follow = olderCount === 0 && nearBottom();
      const frag = document.createDocumentFragment();
      for (const n of pendingNodes) frag.appendChild(n);
      pendingNodes = [];
      liveEl.appendChild(frag);
      while (liveEl.childElementCount > maxLines) liveEl.firstElementChild.remove();
      if (follow) programmaticScroll(logEl.scrollHeight);
    }
    updateHud();
  });
}

function updateHud() {
  for (const f of files.values()) {
    f.countEl.textContent = f.enabled ? f.count.toLocaleString() : "–";
  }
  let stats = `${events.length.toLocaleString()} buffered · ${liveEl.childElementCount.toLocaleString()} shown`;
  if (olderCount > 0) stats += ` · ${olderCount.toLocaleString()} older`;
  statsEl.textContent = stats;
  jumpBtn.hidden = nearBottom() && olderCount === 0;
}

function rerender() {
  pendingNodes = [];
  clearOlder();
  const picked = [];
  for (let i = events.length - 1; i >= 0 && picked.length < maxLines; i--) {
    if (matches(events[i])) picked.push(events[i]);
  }
  picked.reverse();
  const frag = document.createDocumentFragment();
  for (const ev of picked) frag.appendChild(buildLine(ev));
  liveEl.textContent = "";
  liveEl.appendChild(frag);
  programmaticScroll(logEl.scrollHeight);
  updateHud();
}

function clearOlder() {
  if (olderCount === 0 && !olderEl.firstChild) return;
  olderEl.textContent = "";
  olderCount = 0;
  olderLowest.clear();
  olderDone.clear();
}

function divider(text, gap) {
  const d = document.createElement("div");
  d.className = gap ? "divider gap" : "divider";
  d.textContent = text;
  return d;
}

// anchorFor returns the byte offset of the oldest line the UI holds for a
// file: the lowest backfilled offset, else the first live line seen.
function anchorFor(id) {
  if (olderLowest.has(id)) return olderLowest.get(id);
  return liveOldest.get(id); // may be undefined: server then anchors at EOF
}

async function loadOlder() {
  if (loadingOlder) return;
  const targets = [...files.values()].filter((f) => f.enabled && !olderDone.has(f.id));
  if (!targets.length) return;
  loadingOlder = true;
  try {
    const runs = [];
    for (const f of targets) {
      const q = new URLSearchParams({ file: f.id, limit: String(OLDER_PAGE) });
      const anchor = anchorFor(f.id);
      if (anchor !== undefined) q.set("offset", String(anchor));
      let d;
      try {
        const r = await fetch("/api/before?" + q.toString());
        if (!r.ok) { olderDone.add(f.id); continue; }
        d = await r.json();
      } catch { olderDone.add(f.id); continue; }
      if (d.atStart) olderDone.add(f.id);
      if (!Array.isArray(d.lines) || d.lines.length === 0) { olderDone.add(f.id); continue; }
      olderLowest.set(f.id, d.lines[0].off);
      runs.push({ f, lines: d.lines, atStart: !!d.atStart });
    }
    if (runs.length) prependOlder(runs);
  } finally {
    loadingOlder = false;
  }
}

function prependOlder(runs) {
  const frag = document.createDocumentFragment();
  for (const run of runs) {
    frag.appendChild(divider(
      (run.atStart ? "start of " : "older · ") + run.f.name, false));
    let shown = 0;
    for (const ln of run.lines) {
      const ev = { file: run.f.id, text: ln.text, off: ln.off, time: null };
      if (!matches(ev)) continue;
      frag.appendChild(buildLine(ev));
      shown++;
    }
    olderCount += shown;
  }
  const prevHeight = logEl.scrollHeight;
  const prevTop = logEl.scrollTop;
  olderEl.insertBefore(frag, olderEl.firstChild);
  // Keep the viewport anchored on the lines the user was reading.
  programmaticScroll(prevTop + (logEl.scrollHeight - prevHeight));
  // Bound the window: unload the newest part of the scrollback (the part
  // the user already scrolled past) and mark the seam.
  if (olderCount > OLDER_MAX) {
    if (!olderEl.lastElementChild || !olderEl.lastElementChild.classList.contains("gap")) {
      olderEl.appendChild(divider("· · · unloaded — jump to latest to reset · · ·", true));
    }
    const gapEl = olderEl.lastElementChild;
    while (olderCount > OLDER_MAX && gapEl.previousElementSibling) {
      const n = gapEl.previousElementSibling;
      if (n.classList.contains("line")) olderCount--;
      n.remove();
    }
  }
  updateHud();
}

function setStatus(cls, text) {
  statusDot.className = "dot" + (cls ? " " + cls : "");
  statusText.textContent = text;
}

// connect (re)opens the event stream for the currently selected files.
// With nothing selected there is nothing to stream, so no connection is
// held at all.
function connect() {
  if (es) { es.close(); es = null; }
  const selected = [...files.values()].filter((f) => f.enabled);
  if (files.size > 0 && selected.length === 0) {
    setStatus("", "no file selected");
    return;
  }
  const q = new URLSearchParams();
  for (const f of selected) q.append("files", f.id);
  if (lastSeq > 0) q.set("after", String(lastSeq));
  const qs = q.toString();
  es = new EventSource("/events" + (qs ? "?" + qs : ""));
  es.onopen = () => setStatus("live", "live");
  es.onerror = () => setStatus("reconnecting", "reconnecting");
  es.onmessage = onLine;
}

function onLine(msg) {
  let ev;
  try { ev = JSON.parse(msg.data); } catch { return; }
  if (typeof ev.seq !== "number" || ev.seq <= lastSeq) return; // replay dedupe
  lastSeq = ev.seq;
  // A timestamp means "seen arriving live"; replayed history was not, so
  // it renders with the · marker like disk-backfilled lines.
  if (ev.replay) ev.time = null;
  const f = ensureFile(ev.file);
  if (!f.enabled) return; // server filters; this guards fallback modes
  const floor = floors.get(ev.file);
  if (floor !== undefined) {
    if (typeof ev.off === "number" && ev.off < floor) return; // already shown from disk
    floors.delete(ev.file);
  }
  if (!liveOldest.has(ev.file) && typeof ev.off === "number") liveOldest.set(ev.file, ev.off);
  events.push(ev);
  if (events.length > MAX_STORE) events.splice(0, events.length - MAX_STORE);
  f.count++;
  if (!paused && matches(ev)) pendingNodes.push(buildLine(ev));
  scheduleFlush();
}

// toggleFile is the chip click: enabling loads the file's recent lines
// from disk and joins its live stream; disabling purges it from memory and
// drops it from the stream.
async function toggleFile(f) {
  f.enabled = !f.enabled;
  f.itemEl.classList.toggle("on", f.enabled);
  updateFileButton();
  persistSelection();

  if (!f.enabled) {
    events = events.filter((e) => e.file !== f.id);
    liveOldest.delete(f.id);
    floors.delete(f.id);
    f.count = 0;
    rerender();
    connect();
    return;
  }

  rerender();
  try {
    const q = new URLSearchParams({ file: f.id, limit: String(maxLines) });
    const d = await (await fetch("/api/before?" + q.toString())).json();
    if (Array.isArray(d.lines) && d.lines.length) {
      const last = d.lines[d.lines.length - 1];
      floors.set(f.id, last.off + last.text.length + 1);
      liveOldest.set(f.id, d.lines[0].off);
      if (d.atStart) olderDone.add(f.id);
      const loaded = d.lines.map((ln) => ({
        seq: 0, file: f.id, text: ln.text, off: ln.off, time: null,
      }));
      events = loaded.concat(events);
      if (events.length > MAX_STORE) events.splice(0, events.length - MAX_STORE);
      f.count = loaded.length;
      rerender();
    }
  } catch {
    // Disk load failed; live lines will still stream in below.
  }
  connect();
}

let searchTimer;
searchEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    filter = searchEl.value.trim().toLowerCase();
    rerender();
  }, 150);
});

pauseBtn.addEventListener("click", () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "Resume" : "Pause";
  pauseBtn.classList.toggle("active", paused);
  if (!paused) rerender(); // catch up on everything buffered while paused
});

clearBtn.addEventListener("click", () => {
  events = [];
  pendingNodes = [];
  for (const f of files.values()) f.count = 0;
  clearOlder();
  liveEl.textContent = "";
  updateHud();
});

maxLinesEl.addEventListener("change", () => {
  const n = parseInt(maxLinesEl.value, 10);
  maxLines = clampLines(Number.isNaN(n) ? maxLines : n);
  maxLinesEl.value = maxLines;
  localStorage.setItem(LINES_KEY, String(maxLines));
  rerender();
});

jumpBtn.addEventListener("click", () => {
  clearOlder();
  programmaticScroll(logEl.scrollHeight);
  jumpBtn.hidden = true;
  updateHud();
});

// Scrollback loads only on a deliberate upward scroll, and is freed only
// when the user deliberately comes back down to the tail (or hits "Jump to
// latest"). Programmatic scrolls are ignored via ignoreScrollUntil.
let lastScrollTop = 0;
logEl.addEventListener("scroll", () => {
  const st = logEl.scrollTop;
  const scrolledUp = st < lastScrollTop;
  lastScrollTop = st;
  jumpBtn.hidden = nearBottom() && olderCount === 0;
  if (performance.now() < ignoreScrollUntil) return;
  if (scrolledUp && st < 300 && logEl.scrollHeight > logEl.clientHeight) {
    loadOlder();
  } else if (!scrolledUp && olderCount > 0 && nearBottom()) {
    clearOlder();
    programmaticScroll(logEl.scrollHeight);
    updateHud();
  }
}, { passive: true });

// A wheel-up at the very top produces no scroll event; catch it so
// scrollback also starts when the content is shorter than the viewport.
logEl.addEventListener("wheel", (e) => {
  if (e.deltaY < 0 && logEl.scrollTop === 0) loadOlder();
}, { passive: true });

fileBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (fileMenu.hidden) openFileMenu(); else closeFileMenu();
});
fileMenu.addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("click", () => closeFileMenu());
fileSearch.addEventListener("input", filterFileList);
fileMenu.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") {
    e.preventDefault();
    moveActive(1);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    moveActive(-1);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (activeFile) toggleFile(activeFile);
  } else if (e.key === "Escape") {
    e.stopPropagation();
    closeFileMenu();
    fileBtn.focus();
  }
});

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "s") {
    e.preventDefault(); // keep the browser's save dialog out of the way
    if (fileMenu.hidden) openFileMenu(); else closeFileMenu();
  } else if (e.key === "/" && document.activeElement !== searchEl && document.activeElement !== fileSearch) {
    e.preventDefault();
    searchEl.focus();
  } else if (e.key === "Escape") {
    if (document.activeElement === searchEl) {
      searchEl.value = "";
      filter = "";
      searchEl.blur();
      rerender();
    } else {
      closeFileMenu();
    }
  }
});

// refreshFiles re-syncs the dropdown with the server, which re-scans
// directory/glob arguments and Docker containers at runtime: new files
// get a chip, files the server dropped lose theirs (unless still enabled
// — lines on screen stay readable until deselected, and the chip goes on
// the next poll after that), and dedup renames ("app.log" becoming
// "app.log #1") are picked up.
async function refreshFiles() {
  const d = await (await fetch("/api/files")).json();
  const entries = d.files || [];
  const listed = new Set(entries.map((e) => e.id));
  // Files discovered mid-session start deselected (an empty restore set
  // makes ensureFile default to off), never auto-streaming.
  initialSelection = new Set();
  for (const entry of entries) {
    const f = files.get(entry.id);
    if (!f) {
      ensureFile(entry.id, entry.name);
      continue;
    }
    if (entry.name && entry.name !== f.name) {
      f.name = entry.name;
      f.itemEl.title = entry.name;
      f.itemEl.querySelector(".fname").textContent = entry.name;
    }
  }
  initialSelection = null;
  for (const [id, f] of files) {
    if (listed.has(id) || f.enabled) continue;
    if (activeFile === f) setActive(null);
    f.itemEl.remove();
    files.delete(id);
  }
  updateFileButton();
}

// Register the file chips before opening the stream, so "the first file"
// is deterministically the first one on the command line / in the config
// (not whichever file happens to log first). Also pick up the server's
// configured default line count unless the user chose one in this browser.
async function init() {
  try {
    const d = await (await fetch("/api/files")).json();
    const entries = d.files || [];
    // Restore the remembered selection, keeping only names that still
    // exist; when nothing usable is stored, the first-file default applies.
    const saved = savedSelection();
    if (saved && saved.length) {
      const known = new Set(entries.map((e) => e.name));
      const matching = saved.filter((n) => known.has(n));
      if (matching.length) initialSelection = new Set(matching);
    }
    entries.forEach((entry) => ensureFile(entry.id, entry.name));
    initialSelection = null;
    if (localStorage.getItem(LINES_KEY) === null && Number.isInteger(d.lines) && d.lines > 0) {
      maxLines = clampLines(d.lines);
      maxLinesEl.value = maxLines;
    }
  } catch {
    // Stream anyway; chips are then created as lines arrive.
  }
  connect();
  updateHud();
  setInterval(() => { refreshFiles().catch(() => {}); }, 5000);
}
init();
</script>
</body>
</html>
