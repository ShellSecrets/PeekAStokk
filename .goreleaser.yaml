version: 2

project_name: peekastokk

before:
  hooks:
    - go mod tidy

builds:
  - id: peekastokk
    main: .
    binary: peekastokk
    goos:
      - linux
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    goarm:
      - "7"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # No version in the name, so releases/latest/download/<name> always
    # points at the current release's binary (a stable download link).
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Setting `files` replaces GoReleaser's default README*/LICENSE* glob,
    # so list those explicitly alongside config.example (install.sh seeds
    # /etc/peekastokk/config from it) and the man page (install.sh installs
    # it to the system man path).
    files:
      - LICENSE*
      - README*
      - config.example
      - src: man/peekastokk.1
        dst: peekastokk.1

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  draft: false
