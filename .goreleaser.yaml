version: 2

project_name: peekastokk

before:
  hooks:
    - go mod tidy

builds:
  - id: peekastokk
    main: ./main.go
    binary: peekastokk
    goos:
      - linux
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    goarm:
      - "7"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # No version in the name, so releases/latest/download/<name> always
    # points at the current release's binary (a stable download link).
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  draft: false
